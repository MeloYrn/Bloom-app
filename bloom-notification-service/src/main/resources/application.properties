spring.application.name=bloom-notification-service

spring.datasource.url=jdbc:postgresql://localhost:5432/bloom_db
spring.datasource.username=bloom
spring.datasource.password=bloom123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8084

# URL of tracking-service, used to fetch users with an upcoming period.
# Docker Compose resolves service names as hostnames, so this works
# automatically when running via docker-compose. If running locally
# outside Docker, change this to http://localhost:8082
tracking.service.url=http://tracking-service:8082
